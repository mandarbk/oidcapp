server:
  port: 8080
spring:
  application:
    name: ClientApplication
  security:
    oauth2:
      client:
        registration:
          oidcappclient:
            provider: spring
            client-id: admin_client
            client-secret: secret
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_basic
            redirect-uri: http://client-application/login/oauth2/code/{registrationId}
            scope: write,openid
        provider:
          spring:
            authorization-uri: http://authorization-server/oauth2/authorize
            token-uri: http://authorization-server/oauth2/token
            jwk-set-uri: http://authorization-server/oauth2/jwks

logging:
  level:
    org.springframework.security: TRACE
